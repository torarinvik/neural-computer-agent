[project]
name = "neural-computer-agent"
version = "0.1.0"
description = "Sample-efficient real-time neural computer research"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
# Research audits remain outside the default package lint surface. The
# canonical lint script explicitly adds the two retained experiment suites.
extend-exclude = ["experiments"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "campaign: long-running archived research audit; excluded from the fast suite",
]
