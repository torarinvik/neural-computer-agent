[project]
name = "neural-computer-agent"
version = "0.1.0"
description = "Sample-efficient real-time neural computer research"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
# Research trainers, probes, and compatibility readers are intentionally not
# part of the production lint surface. They retain their own historical test
# boundary; scripts/lint_canonical.sh adds the currently maintained trainer.
extend-exclude = ["experiments"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
