[program:forward_transfer_temporal_pairwise_width_sweep]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'for width in 16 32 64; do /venv/main/bin/python -m experiments.forward_transfer_attention.probe_temporal_event_snapshot_binder --controller-checkpoint experiments/forward_transfer_attention/targeted_decorrelated/seed_23.pt --consolidator-checkpoint experiments/forward_transfer_attention/targeted_consolidator_replication/seed_23.pt --report experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/pairwise_direct_color_width_${width}_1024_2k.json --train-lifetimes 1024 --test-lifetimes 2048 --batch-size 128 --steps 2000 --eval-every 100 --learning-rate 0.0003 --architecture pairwise --width ${width} --feedback-mode color-button --seed 23 --device cuda || exit 1; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/pairwise_width_sweep.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/pairwise_width_sweep.err.log
stopasgroup=true
killasgroup=true
