[program:forward_transfer_temporal_event_binding_spatial_precision]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'set -e; out=experiments/forward_transfer_attention/targeted_temporal_event_binding_integration; base_controller=experiments/forward_transfer_attention/targeted_decorrelated/seed_23.pt; base_consolidator=experiments/forward_transfer_attention/targeted_consolidator_replication/seed_23.pt; adapted="$out/joint_reader_rehearsal.epoch_0020.pt"; for seed in 23 29; do /venv/main/bin/python -m experiments.forward_transfer_attention.evaluate_cross_primitive --controller-checkpoint "$base_controller" --consolidator-checkpoint "$base_consolidator" --report "$out/spatial_precision_base_seed_${seed}.json" --eval-lifetimes 2048 --batch-size 128 --query-count 4 --seed "$seed" --primitive spatial --device cuda; /venv/main/bin/python -m experiments.forward_transfer_attention.evaluate_cross_primitive --controller-checkpoint "$adapted" --report "$out/spatial_precision_adapted_seed_${seed}.json" --eval-lifetimes 2048 --batch-size 128 --query-count 4 --seed "$seed" --primitive spatial --device cuda; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/spatial_precision.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/spatial_precision.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

