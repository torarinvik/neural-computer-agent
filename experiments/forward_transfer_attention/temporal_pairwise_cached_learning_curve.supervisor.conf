[program:forward_transfer_temporal_pairwise_cached_learning_curve]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'set -e; for spec in 256:4:1k_augmented 1024:4:4k_augmented 4096:1:4k_unique; do IFS=: read -r lifetimes variants name <<< "$spec"; /venv/main/bin/python -m experiments.forward_transfer_attention.probe_temporal_event_snapshot_binder --controller-checkpoint experiments/forward_transfer_attention/targeted_decorrelated/seed_23.pt --consolidator-checkpoint experiments/forward_transfer_attention/targeted_consolidator_replication/seed_23.pt --report experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/pairwise_direct_color_curve_${name}_4k.json --train-lifetimes 4096 --test-lifetimes 4096 --train-render-variants 4 --test-render-variants 1 --train-subset-lifetimes "$lifetimes" --train-subset-render-variants "$variants" --train-cache experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/cache/direct_color_train_4096x4.pt --test-cache experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/cache/direct_color_test_4096.pt --batch-size 256 --steps 4000 --eval-every 200 --learning-rate 0.0003 --architecture pairwise --width 64 --feedback-mode color-button --seed 23 --device cuda || exit 1; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/pairwise_cached_learning_curve.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_snapshot_binder/pairwise_cached_learning_curve.err.log
stopasgroup=true
killasgroup=true
