command=/venv/main/bin/python -m experiments.forward_transfer_attention.train_joint_adapter --controller-checkpoint experiments/forward_transfer_attention/targeted_decorrelated/seed_23.pt --consolidator-checkpoint experiments/forward_transfer_attention/targeted_consolidator_replication/seed_23.pt --checkpoint experiments/forward_transfer_attention/targeted_temporal_writer_pilot/seed_23.pt --report experiments/forward_transfer_attention/targeted_temporal_writer_pilot/seed_23.json --train-lifetimes 512 --eval-lifetimes 512 --batch-size 64 --epochs 8 --writer-only --freeze-answer-head --temporal-old-weight 0.5 --temporal-future-weight 4.0 --controller-learning-rate 0.001 --seed 23 --device cuda
