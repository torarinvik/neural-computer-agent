[program:forward_transfer_temporal_event_binding_joint_checkpoint_probes]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'set -e; out=experiments/forward_transfer_attention/targeted_temporal_event_binding_integration; for epoch in 0005 0010 0020; do checkpoint="$out/joint_reader_rehearsal.epoch_${epoch}.pt"; /venv/main/bin/python -m experiments.forward_transfer_attention.probe_temporal_rule_memory --controller-checkpoint "$checkpoint" --consolidator-checkpoint "$checkpoint" --report "$out/joint_rule_path_epoch_${epoch}.json" --train-lifetimes 512 --test-lifetimes 512 --batch-size 256 --feedback-mode color-button --shots 1 --taps raw_write_row,memory_row,recalled --seed 23 --device cuda; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/joint_checkpoint_probes.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/joint_checkpoint_probes.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

