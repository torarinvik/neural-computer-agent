[program:forward_transfer_temporal_event_binding_checkpoint_probes]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'set -e; for epoch in 0010 0020 0040; do checkpoint=experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/overfit_32.epoch_${epoch}.pt; /venv/main/bin/python -m experiments.forward_transfer_attention.probe_temporal_rule_memory --controller-checkpoint "$checkpoint" --consolidator-checkpoint "$checkpoint" --report experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/rule_path_epoch_${epoch}.json --train-lifetimes 512 --test-lifetimes 512 --batch-size 256 --feedback-mode color-button --shots 1 --taps raw_write_row,memory_row,recalled --seed 23 --device cuda; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/checkpoint_probes.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/checkpoint_probes.err.log
stopasgroup=true
killasgroup=true
