[program:forward_transfer_temporal_event_binding_joint_retention]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'set -e; out=experiments/forward_transfer_attention/targeted_temporal_event_binding_integration; checkpoint="$out/joint_reader_rehearsal.epoch_0020.pt"; for primitive in spatial shape; do /venv/main/bin/python -m experiments.forward_transfer_attention.evaluate_cross_primitive --controller-checkpoint "$checkpoint" --report "$out/joint_retention_epoch_0020_${primitive}.json" --eval-lifetimes 512 --batch-size 128 --query-count 4 --seed 23 --primitive "$primitive" --device cuda; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/joint_retention.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/joint_retention.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

