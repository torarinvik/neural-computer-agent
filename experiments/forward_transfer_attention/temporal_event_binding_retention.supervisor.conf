[program:forward_transfer_temporal_event_binding_retention]
directory=/root/elisa-screenwatch
command=/bin/bash -lc 'set -e; out=experiments/forward_transfer_attention/targeted_temporal_event_binding_integration; base_controller=experiments/forward_transfer_attention/targeted_decorrelated/seed_23.pt; base_consolidator=experiments/forward_transfer_attention/targeted_consolidator_replication/seed_23.pt; adapted=$out/overfit_32.epoch_0040.pt; for primitive in spatial shape; do /venv/main/bin/python -m experiments.forward_transfer_attention.evaluate_cross_primitive --controller-checkpoint "$base_controller" --consolidator-checkpoint "$base_consolidator" --report "$out/retention_base_${primitive}.json" --eval-lifetimes 512 --batch-size 128 --query-count 4 --seed 23 --primitive "$primitive" --device cuda; /venv/main/bin/python -m experiments.forward_transfer_attention.evaluate_cross_primitive --controller-checkpoint "$adapted" --report "$out/retention_epoch_0040_${primitive}.json" --eval-lifetimes 512 --batch-size 128 --query-count 4 --seed 23 --primitive "$primitive" --device cuda; done'
autostart=false
autorestart=false
stdout_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/retention.log
stderr_logfile=/root/elisa-screenwatch/experiments/forward_transfer_attention/targeted_temporal_event_binding_integration/retention.err.log
stopasgroup=true
killasgroup=true
